data:
  workbook: data/egov_ru.xlsx

chroma:
  path: data/chroma
  collection: egov_services

ollama:
  base_url: http://127.0.0.1:11434
  embedding_model: qwen3-embedding:0.6b
  request_timeout_seconds: 180
  embedding_keep_alive: 5m

groq:
  base_url: https://api.groq.com/openai/v1
  chat_model: qwen/qwen3.8-27b
  api_key_env: GROQ_KEY
  ca_bundle_env: GROQ_CA_BUNDLE
  request_timeout_seconds: 120
  reasoning_effort: none

index:
  batch_size: 64
  embedding_keep_alive: 5m

retrieval:
  top_k: 3
  candidate_k: 30
  rrf_k: 60
  alias_candidate_multiplier: 4
  min_semantic_similarity: 0.6

reranker:
  enabled: true
  model: models/mmarco-mMiniLMv2-L12-h384-v1
  candidate_k: 10
  min_score: 0.0
  max_length: 512
  max_passage_chars: 4000
  batch_size: 8
  device: cpu

evaluation:
  dataset: evals/rag_eval_30.jsonl

summarization:
  enabled: false
  max_tokens: 64
  temperature: 0.0
  think: false

generation:
  max_context_chars: 3000
  max_tokens: 1000
  temperature: 0.1
  think: false

server:
  host: 127.0.0.1
  port: 8000
  warmup_embedding: true

frontend:
  api_url: http://127.0.0.1:8000/ask/invoke
  request_timeout_seconds: 240

langfuse:
  enabled: false
  run_name: egov-question
